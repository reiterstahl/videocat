[package]
name = "videocat-companion"
version = "0.3.0"
description = "VideoCAT Companion for Windows: tray shell around the Node agent (Tauri)."
edition = "2021"
license = "AGPL-3.0-or-later"
publish = false

[[bin]]
name = "videocat-companion"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.12", features = ["tray-icon", "image-png"] }
# Keep in sync with VELOPACK_VERSION in the release workflows.
velopack = "=1.2.161"

[features]
# Production builds embed the static assets instead of a dev server.
custom-protocol = ["tauri/custom-protocol"]
default = ["custom-protocol"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
