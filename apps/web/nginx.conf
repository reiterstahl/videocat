map $http_x_forwarded_proto $videocat_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

map $videocat_forwarded_proto $videocat_hsts {
  default "";
  https "max-age=31536000; includeSubDomains";
}

map $http_upgrade $videocat_connection_upgrade {
  default upgrade;
  "" close;
}

server {
  listen 8080;
  server_name _;
  client_max_body_size 25m;

  include /etc/nginx/snippets/videocat-security-headers.conf;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  location = /index.html {
    include /etc/nginx/snippets/videocat-security-headers.conf;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    try_files /index.html =404;
  }

  location /assets/ {
    include /etc/nginx/snippets/videocat-security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    include /etc/nginx/snippets/videocat-security-headers.conf;
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    try_files $uri /index.html;
  }

  # Installable app: the service worker and manifest must be revalidated on every load.
  location = /sw.js {
    include /etc/nginx/snippets/videocat-security-headers.conf;
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location ~ ^/workbox-[A-Za-z0-9_-]+\.js$ {
    include /etc/nginx/snippets/videocat-security-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    include /etc/nginx/snippets/videocat-security-headers.conf;
    types { application/manifest+json webmanifest; }
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }

  location /pwa/ {
    include /etc/nginx/snippets/videocat-security-headers.conf;
    add_header Cache-Control "public, max-age=604800" always;
    try_files $uri =404;
  }

  location /api/ {
    proxy_pass http://server:4000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $videocat_forwarded_proto;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $videocat_connection_upgrade;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location /api/streams/ {
    proxy_pass http://server:4000/api/streams/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $videocat_forwarded_proto;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header X-Content-Type-Options "nosniff" always;
  }

  location /thumbnails/ {
    proxy_pass http://server:4000/thumbnails/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $videocat_forwarded_proto;
  }
}
