map $http_x_forwarded_proto $videocat_forwarded_proto {
  default $http_x_forwarded_proto;
  "" $scheme;
}

map $videocat_forwarded_proto $videocat_hsts {
  default "";
  https "max-age=31536000; includeSubDomains";
}

server {
  listen 80;
  server_name _;
  client_max_body_size 25m;

  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://127.0.0.1:29429 http://localhost:29429 http://127.0.0.1:18431 http://localhost:18431 http://127.0.0.1:23447 http://localhost:23447 http://127.0.0.1:31469 http://localhost:31469 http://127.0.0.1:37483 http://localhost:37483 http://127.0.0.1:43517 http://localhost:43517 http://127.0.0.1:49627 http://localhost:49627 http://127.0.0.1:55733 http://localhost:55733 http://127.0.0.1:60149 http://localhost:60149 http://127.0.0.1:15319 http://localhost:15319 http://127.0.0.1:26891 http://localhost:26891; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
  add_header Cross-Origin-Resource-Policy "same-origin" always;
  add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
  add_header Referrer-Policy "no-referrer" always;
  add_header Strict-Transport-Security $videocat_hsts always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;
  server_tokens off;

  root /usr/share/nginx/html;
  index index.html;

  location = /index.html {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    try_files /index.html =404;
  }

  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0" always;
    try_files $uri /index.html;
  }

  location /api/ {
    proxy_pass http://server:4000/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $videocat_forwarded_proto;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  location /thumbnails/ {
    proxy_pass http://server:4000/thumbnails/;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $videocat_forwarded_proto;
  }
}
