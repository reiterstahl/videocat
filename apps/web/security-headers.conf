# Security headers for every response served by this container.
# nginx drops server-level add_header in any location that defines its own, so each such location includes this file.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' http://127.0.0.1:29429 http://localhost:29429 http://127.0.0.1:18431 http://localhost:18431 http://127.0.0.1:23447 http://localhost:23447 http://127.0.0.1:31469 http://localhost:31469 http://127.0.0.1:37483 http://localhost:37483 http://127.0.0.1:43517 http://localhost:43517 http://127.0.0.1:49627 http://localhost:49627 http://127.0.0.1:55733 http://localhost:55733 http://127.0.0.1:60149 http://localhost:60149 http://127.0.0.1:15319 http://localhost:15319 http://127.0.0.1:26891 http://localhost:26891; worker-src 'self'; manifest-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
add_header Referrer-Policy "no-referrer" always;
add_header Strict-Transport-Security $videocat_hsts always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
