name: Release Companion

# Publishing is automatic: when a push to main changes the Companion version in
# apps/agent-windows/package.json and no `vX.Y.Z` tag exists yet, this workflow builds the
# Windows Companion with Velopack, creates the tag and publishes the GitHub Release.
# Installed Companions check these releases, download new versions in the background and
# apply them on restart. Manual runs build an artifact, and publish only when asked to.
# A manual run with "beta" publishes X.Y.Z-beta.N as a GitHub prerelease for testing: installed
# Companions never update to it (they skip prereleases), and its Setup.exe updates to the next
# stable release on its own. Packaging checks that both Electron's Node and the agent's (Node
# SEA) carry the October 2026 Node.js security fixes.
on:
  push:
    branches: [main]
    paths:
      - apps/agent-windows/package.json
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the release if the version's tag does not exist yet"
        type: boolean
        default: false
      beta:
        description: "Beta number: builds X.Y.Z-beta.N as a prerelease for testing (empty for a stable release)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: release-companion
  cancel-in-progress: false

env:
  # Keep in sync with the velopack dependency in apps/agent-windows/package.json.
  VELOPACK_VERSION: 1.2.161
  PACK_ID: VideoCAT-Companion
  RELEASE_DIR: apps/agent-windows/release/velopack

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      pack_version: ${{ steps.version.outputs.pack_version }}
      beta: ${{ steps.version.outputs.beta }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v7
      - name: Decide whether to publish
        id: version
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUBLISH_INPUT: ${{ inputs.publish }}
          BETA_INPUT: ${{ inputs.beta }}
        run: |
          version=$(jq -r .version apps/agent-windows/package.json)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid Companion version: $version" >&2
            exit 1
          fi
          beta=false
          pack_version="$version"
          if [ -n "$BETA_INPUT" ]; then
            if ! [[ "$BETA_INPUT" =~ ^[1-9][0-9]*$ ]]; then
              echo "Invalid beta number: $BETA_INPUT" >&2
              exit 1
            fi
            beta=true
            pack_version="$version-beta.$BETA_INPUT"
          fi
          publish=false
          if git ls-remote --exit-code --tags origin "refs/tags/v$pack_version" >/dev/null; then
            echo "::notice::v$pack_version is already tagged; building without publishing."
          elif [ "$EVENT_NAME" = "push" ] || [ "$PUBLISH_INPUT" = "true" ]; then
            publish=true
            echo "::notice::Publishing Companion v$pack_version."
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"
          echo "pack_version=$pack_version" >> "$GITHUB_OUTPUT"
          echo "beta=$beta" >> "$GITHUB_OUTPUT"
          echo "publish=$publish" >> "$GITHUB_OUTPUT"

  companion:
    needs: detect
    runs-on: windows-2025
    timeout-minutes: 40
    permissions:
      contents: write
      id-token: write
      attestations: write
    env:
      VERSION: ${{ needs.detect.outputs.version }}
      PACK_VERSION: ${{ needs.detect.outputs.pack_version }}
      BETA: ${{ needs.detect.outputs.beta }}
      PUBLISH: ${{ needs.detect.outputs.publish }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          # Pin the build/SEA runtime; Electron is checked separately before packaging.
          node-version-file: .nvmrc
          cache: npm

      - name: Check the Node.js build runtime
        shell: bash
        run: test "$(node --version)" = "v24.22.1"

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x

      - name: Install Velopack CLI
        shell: pwsh
        run: |
          dotnet tool install -g vpk --version $env:VELOPACK_VERSION
          "$env:USERPROFILE\.dotnet\tools" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Install, check and build
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed" }
          npm run build -w @videocat/shared
          if ($LASTEXITCODE -ne 0) { throw "shared build failed" }
          npm run typecheck -w @videocat/agent-windows
          if ($LASTEXITCODE -ne 0) { throw "Companion typecheck failed" }
          npm run typecheck:tray -w @videocat/agent-windows
          if ($LASTEXITCODE -ne 0) { throw "tray typecheck failed" }
          npm run package:tray -w @videocat/agent-windows
          if ($LASTEXITCODE -ne 0) { throw "Electron packaging failed" }

      - name: Download previous release for delta updates
        if: env.PUBLISH == 'true'
        shell: pwsh
        env:
          VPK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          # Releases before Velopack have nothing to download; packing still builds a full package.
          vpk download github --repoUrl $env:REPO_URL --outputDir $env:RELEASE_DIR
          if ($LASTEXITCODE -ne 0) {
            Write-Host "No previous Velopack release was downloaded; continuing without deltas."
            $global:LASTEXITCODE = 0
          }

      - name: Pack with Velopack
        shell: pwsh
        run: |
          vpk pack `
            --packId $env:PACK_ID `
            --packVersion $env:PACK_VERSION `
            --packDir "apps/agent-windows/release/win-unpacked" `
            --mainExe "VideoCAT Companion.exe" `
            --packTitle "VideoCAT Companion" `
            --packAuthors "VideoCAT" `
            --icon "apps/agent-windows/build/icon.ico" `
            --outputDir $env:RELEASE_DIR
          if ($LASTEXITCODE -ne 0) { throw "vpk pack exited with code $LASTEXITCODE." }
          $setup = Join-Path $env:RELEASE_DIR "$env:PACK_ID-win-Setup.exe"
          $hash = (Get-FileHash -LiteralPath $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          [IO.File]::WriteAllText("$setup.sha256", "$hash  $env:PACK_ID-win-Setup.exe`r`n", [Text.Encoding]::ASCII)
          Get-ChildItem -LiteralPath $env:RELEASE_DIR -File | Sort-Object Name | ForEach-Object { "{0,12:N0}  {1}" -f $_.Length, $_.Name }

      - uses: actions/attest-build-provenance@v4
        if: env.PUBLISH == 'true'
        with:
          subject-path: ${{ env.RELEASE_DIR }}/${{ env.PACK_ID }}-win-Setup.exe

      - uses: actions/upload-artifact@v7
        with:
          name: videocat-companion-${{ env.PACK_VERSION }}
          path: ${{ env.RELEASE_DIR }}
          if-no-files-found: error

      - name: Publish GitHub Release
        if: env.PUBLISH == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VPK_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          $env:TAG = "v$env:PACK_VERSION"
          $beta = $env:BETA -eq 'true'
          # Velopack creates the tag on this commit inside a draft release, so Companions never
          # see a release without its update feed. A beta is a prerelease, which they skip.
          $preFlag = @()
          if ($beta) { $preFlag = @("--pre") }
          vpk upload github --repoUrl $env:REPO_URL --outputDir $env:RELEASE_DIR --tag $env:TAG `
            --targetCommitish $env:GITHUB_SHA --releaseName "VideoCAT v$env:PACK_VERSION" --merge @preFlag
          if ($LASTEXITCODE -ne 0) { throw "vpk upload exited with code $LASTEXITCODE." }
          gh release upload $env:TAG "$env:RELEASE_DIR/$env:PACK_ID-win-Setup.exe.sha256" --clobber
          if ($LASTEXITCODE -ne 0) { throw "Uploading the checksum failed." }
          gh api "repos/${{ github.repository }}/releases/generate-notes" -f tag_name=$env:TAG --jq .body > release-notes.md
          if ($LASTEXITCODE -ne 0) { throw "Generating release notes failed." }
          if ($beta) {
            $warning = "> [!WARNING]`n> Beta for testing. Installed Companions do not update to it; install it with its Setup.exe. It updates to the next stable release on its own.`n`n"
            [IO.File]::WriteAllText("release-notes.md", $warning + [IO.File]::ReadAllText("release-notes.md"))
            gh release edit $env:TAG --notes-file release-notes.md --draft=false --prerelease --latest=false
          } else {
            gh release edit $env:TAG --notes-file release-notes.md --draft=false --latest
          }
          if ($LASTEXITCODE -ne 0) { throw "Publishing the release failed." }

  sbom:
    needs: [detect, companion]
    if: needs.detect.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v7
      - uses: anchore/sbom-action@v0
        with:
          path: .
          format: spdx-json
          output-file: videocat.spdx.json
          upload-release-assets: false
      - name: Attach SBOM to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: v${{ needs.detect.outputs.pack_version }}
        run: gh release upload "$TAG" videocat.spdx.json --clobber
      - uses: actions/attest-build-provenance@v4
        with:
          subject-path: videocat.spdx.json
