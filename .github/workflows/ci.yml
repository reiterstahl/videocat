name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: videocat
          POSTGRES_USER: videocat
          POSTGRES_PASSWORD: videocat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U videocat -d videocat"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://videocat:videocat@localhost:5432/videocat
      JWT_SECRET: 0123456789abcdef0123456789abcdef
      AGENT_TOKEN: 0123456789abcdef0123456789abcdef
      PROTECTED_FOLDER_PIN: "5678"
      PROTECTED_FOLDER_PATTERNS: Private,Protected
      ADMIN_USER: admin
      ADMIN_PASSWORD: test-password-12345
      WEB_ORIGIN: http://localhost:5173
      TRUST_PROXY: "false"
      COOKIE_SECURE: "false"
      THUMBNAILS_DIR: /tmp/videocat-thumbnails
      RUN_DB_TESTS: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/package-companion.ps1",
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List | Out-String | Write-Error
            exit 1
          }
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Apply database migrations
        run: npm run prisma:migrate
      - name: Run tests
        run: npm test
      - name: Type-check workspaces
        run: npm run typecheck
      - name: Build application
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: videocat
          POSTGRES_USER: videocat
          POSTGRES_PASSWORD: videocat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U videocat -d videocat"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://videocat:videocat@localhost:5432/videocat
      JWT_SECRET: 0123456789abcdef0123456789abcdef
      AGENT_TOKEN: 0123456789abcdef0123456789abcdef
      PROTECTED_FOLDER_PIN: "5678"
      PROTECTED_FOLDER_PATTERNS: Private,Protected
      ADMIN_USER: admin
      ADMIN_PASSWORD: test-password-12345
      WEB_ORIGIN: http://localhost:5173
      SERVER_HOST: 127.0.0.1
      SERVER_PORT: "4000"
      TRUST_PROXY: "false"
      COOKIE_SECURE: "false"
      THUMBNAILS_DIR: /tmp/videocat-e2e-thumbnails
      E2E_SEED: "1"
      STORAGE_SECRET_KEY: 0f1e2d3c4b5a69788796a5b4c3d2e1f00f1e2d3c4b5a69788796a5b4c3d2e1f0
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare database and shared package
        run: |
          npm run prisma:migrate
          npm run prisma:generate
          npm run build -w @videocat/shared
      - name: Install Chromium
        # A stuck apt mirror or browser download should fail fast instead of eating the job budget.
        timeout-minutes: 8
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/.report
          retention-days: 7

  # Drive health on a real Windows machine (the runner is an administrator): packs smartctl, turns
  # the check on over a planted junction, checks the folders' permissions, runs the task, reads
  # its results with the Companion's code and turns it off again.
  companion-smart:
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        shell: pwsh
        run: |
          npm ci
          if ($LASTEXITCODE -ne 0) { throw "npm ci failed" }
          npm run build -w @videocat/shared
          if ($LASTEXITCODE -ne 0) { throw "shared build failed" }
      - name: Pack smartctl
        shell: pwsh
        run: |
          node apps/agent-windows/scripts/fetch-smartctl.mjs "$env:RUNNER_TEMP\smartmontools"
          if ($LASTEXITCODE -ne 0) { throw "fetch-smartctl failed" }
      - name: Turn the check on over a planted junction
        shell: pwsh
        run: |
          # What a user could prepare: ProgramData\VideoCAT as a link to a folder of theirs.
          $decoy = Join-Path $env:RUNNER_TEMP 'decoy'
          New-Item -ItemType Directory -Path $decoy | Out-Null
          Set-Content -LiteralPath (Join-Path $decoy 'canary.txt') -Value 'untouched'
          New-Item -ItemType Junction -Path (Join-Path $env:ProgramData 'VideoCAT') -Target $decoy | Out-Null
          $sid = ([Security.Principal.WindowsIdentity]::GetCurrent()).User.Value
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File apps/agent-windows/smart/smart-setup.ps1 -Source "$env:RUNNER_TEMP\smartmontools" -UserSid $sid
          if ($LASTEXITCODE -ne 0) { throw "smart-setup exited with $LASTEXITCODE" }
          if ((Get-Content -LiteralPath (Join-Path $decoy 'canary.txt')) -ne 'untouched') { throw 'The junction was followed' }
          if ((Get-Item -LiteralPath (Join-Path $env:ProgramData 'VideoCAT') -Force).Attributes -band [IO.FileAttributes]::ReparsePoint) { throw 'ProgramData\VideoCAT is still a link' }
          # Bits that let someone change a folder: create files or folders, write attributes, delete,
          # change permissions, take ownership, and the generic write and all. (Modify and FullControl
          # also contain the read bits, so they cannot be the mask.)
          [int64]$writeBits = 0x2 -bor 0x4 -bor 0x10 -bor 0x40 -bor 0x100 -bor 0x10000 -bor 0x40000 -bor 0x80000 -bor 0x40000000 -bor 0x10000000
          foreach ($folder in @((Join-Path $env:ProgramData 'VideoCAT'), (Join-Path $env:ProgramData 'VideoCAT\smart'), (Join-Path $env:ProgramFiles 'VideoCAT SMART'))) {
            $acl = Get-Acl -LiteralPath $folder
            $acl.Access | ForEach-Object { "  $($_.IdentityReference): $($_.FileSystemRights) ($($_.AccessControlType))" }
            # Administrators, SYSTEM and TrustedInstaller; CREATOR OWNER (inherited in Program Files)
            # only reaches what its owner creates, and only administrators create there.
            # Read as SIDs: some inherited names (ALL APPLICATION PACKAGES) do not translate back.
            $writers = $acl.GetAccessRules($true, $true, [Security.Principal.SecurityIdentifier]) | Where-Object {
              $_.AccessControlType -eq 'Allow' -and
              $_.IdentityReference.Value -notin @('S-1-5-32-544', 'S-1-5-18', 'S-1-5-80-956008885-3418522649-1831038044-1853292631-2271478464', 'S-1-3-0') -and
              ([int64]$_.FileSystemRights -band $writeBits)
            }
            if ($writers) { throw "$folder can be written by: $($writers.IdentityReference -join ', ')" }
            "${folder}: only administrators and SYSTEM can write"
          }
          if (-not (Get-ScheduledTask -TaskPath '\VideoCAT\' -TaskName 'Salud de discos' -ErrorAction SilentlyContinue)) { throw 'The task was not registered' }
      - name: Run the task and read its results
        shell: pwsh
        run: |
          schtasks.exe /Run /TN "\VideoCAT\Salud de discos"
          if ($LASTEXITCODE -ne 0) { throw "schtasks /Run exited with $LASTEXITCODE" }
          $results = Join-Path $env:ProgramData 'VideoCAT\smart\smart.json'
          for ($i = 0; $i -lt 60 -and -not (Test-Path $results); $i++) { Start-Sleep -Seconds 2 }
          if (-not (Test-Path $results)) { throw 'The task wrote no results in 2 minutes' }
          npx tsx tests/windows/disk-health-results.ts
          if ($LASTEXITCODE -ne 0) { throw "Reading the results failed" }
      - name: Turn the check off
        if: always()
        shell: pwsh
        run: |
          & powershell.exe -NoProfile -ExecutionPolicy Bypass -File apps/agent-windows/smart/smart-setup.ps1 -Remove
          if ($LASTEXITCODE -ne 0) { throw "smart-setup -Remove exited with $LASTEXITCODE" }
          if (Get-ScheduledTask -TaskPath '\VideoCAT\' -TaskName 'Salud de discos' -ErrorAction SilentlyContinue) { throw 'The task is still there' }
          if (Test-Path (Join-Path $env:ProgramFiles 'VideoCAT SMART')) { throw 'Program Files\VideoCAT SMART is still there' }

  docker:
    # Build the images without pushing, so dependency or Dockerfile changes cannot break a release.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: false
          load: true
          tags: videocat-server:ci
          # Always fetch the latest security updates of the base packages.
          no-cache-filters: base
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
      - name: Build scanner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          target: scanner
          push: false
          load: true
          tags: videocat-scanner:ci
          no-cache-filters: base
          cache-from: type=gha,scope=server
      - name: Check the scanner image has ffmpeg and the server image does not
        run: |
          docker run --rm --entrypoint ffprobe videocat-scanner:ci -version | head -1
          if docker run --rm --entrypoint sh videocat-server:ci -c 'command -v ffmpeg'; then
            echo "The server image must not carry ffmpeg" >&2
            exit 1
          fi
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: videocat-web:ci
          no-cache-filters: runtime
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Scan images for fixable vulnerabilities
        # Fails on critical or high findings that already have a fix, so a stale base or a
        # vulnerable dependency is caught before a release. Unfixed distro advisories are reported only.
        run: |
          for image in videocat-server:ci videocat-scanner:ci videocat-web:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 \
              image --quiet --scanners vuln --ignore-unfixed --severity CRITICAL,HIGH --exit-code 1 "$image"
          done
