name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: videocat
          POSTGRES_USER: videocat
          POSTGRES_PASSWORD: videocat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U videocat -d videocat"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://videocat:videocat@localhost:5432/videocat
      JWT_SECRET: 0123456789abcdef0123456789abcdef
      AGENT_TOKEN: 0123456789abcdef0123456789abcdef
      PROTECTED_FOLDER_PIN: "5678"
      PROTECTED_FOLDER_PATTERNS: Private,Protected
      ADMIN_USER: admin
      ADMIN_PASSWORD: test-password-12345
      WEB_ORIGIN: http://localhost:5173
      TRUST_PROXY: "false"
      COOKIE_SECURE: "false"
      THUMBNAILS_DIR: /tmp/videocat-thumbnails
      RUN_DB_TESTS: "true"
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Validate PowerShell scripts
        shell: pwsh
        run: |
          $tokens = $null
          $parseErrors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            "$PWD/package-companion.ps1",
            [ref]$tokens,
            [ref]$parseErrors
          ) | Out-Null
          if ($parseErrors.Count -gt 0) {
            $parseErrors | Format-List | Out-String | Write-Error
            exit 1
          }
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - name: Apply database migrations
        run: npm run prisma:migrate
      - name: Run tests
        run: npm test
      - name: Type-check workspaces
        run: npm run typecheck
      - name: Build application
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: videocat
          POSTGRES_USER: videocat
          POSTGRES_PASSWORD: videocat
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U videocat -d videocat"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://videocat:videocat@localhost:5432/videocat
      JWT_SECRET: 0123456789abcdef0123456789abcdef
      AGENT_TOKEN: 0123456789abcdef0123456789abcdef
      PROTECTED_FOLDER_PIN: "5678"
      PROTECTED_FOLDER_PATTERNS: Private,Protected
      ADMIN_USER: admin
      ADMIN_PASSWORD: test-password-12345
      WEB_ORIGIN: http://localhost:5173
      SERVER_HOST: 127.0.0.1
      SERVER_PORT: "4000"
      TRUST_PROXY: "false"
      COOKIE_SECURE: "false"
      THUMBNAILS_DIR: /tmp/videocat-e2e-thumbnails
      E2E_SEED: "1"
      STORAGE_SECRET_KEY: 0f1e2d3c4b5a69788796a5b4c3d2e1f00f1e2d3c4b5a69788796a5b4c3d2e1f0
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Prepare database and shared package
        run: |
          npm run prisma:migrate
          npm run prisma:generate
          npm run build -w @videocat/shared
      - name: Install Chromium
        # A stuck apt mirror or browser download should fail fast instead of eating the job budget.
        timeout-minutes: 8
        run: npx playwright install --with-deps chromium
      - name: Run end-to-end tests
        run: npm run test:e2e
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: e2e/.report
          retention-days: 7

  docker:
    # Build both images without pushing, so dependency or Dockerfile changes cannot break a release.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build server image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          push: false
          load: true
          tags: videocat-server:ci
          # Always fetch the latest security updates of the base packages.
          no-cache-filters: base
          cache-from: type=gha,scope=server
          cache-to: type=gha,mode=max,scope=server
      - name: Build web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: false
          load: true
          tags: videocat-web:ci
          no-cache-filters: runtime
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web
      - name: Scan images for fixable vulnerabilities
        # Fails on critical or high findings that already have a fix, so a stale base or a
        # vulnerable dependency is caught before a release. Unfixed distro advisories are reported only.
        run: |
          for image in videocat-server:ci videocat-web:ci; do
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock aquasec/trivy:0.58.1 \
              image --quiet --scanners vuln --ignore-unfixed --severity CRITICAL,HIGH --exit-code 1 "$image"
          done
