name: SBOM

# Tagged releases build their SBOM in release-companion.yml once the release exists.
on:
  workflow_dispatch:

permissions:
  # write: sbom-action attaches the SBOM to the tag's GitHub release.
  contents: write
  id-token: write
  attestations: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: spdx-json
          output-file: videocat.spdx.json
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: videocat.spdx.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: videocat-sbom
          path: videocat.spdx.json
          if-no-files-found: error
