services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-videocat}
      POSTGRES_USER: ${POSTGRES_USER:-videocat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env to a strong random value}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER:-videocat}\" -d \"$${POSTGRES_DB:-videocat}\""]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: volumes created by root-run releases (< 0.2.0) are handed to the non-root server user.
  thumbnails-init:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    user: "0:0"
    restart: "no"
    read_only: true
    network_mode: none
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_READ_SEARCH
    security_opt:
      - no-new-privileges:true
    entrypoint: ["sh", "-c", "find /data/video-catalog/thumbnails \\( ! -user 1000 -o ! -group 1000 \\) -exec chown -h 1000:1000 {} +"]
    volumes:
      - thumbnails_data:/data/video-catalog/thumbnails

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      thumbnails-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql://${POSTGRES_USER:-videocat}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env to a strong random value}@postgres:5432/${POSTGRES_DB:-videocat}}
      SERVER_HOST: 0.0.0.0
      SERVER_PORT: 4000
      WEB_ORIGIN: ${WEB_ORIGIN:-http://localhost:8081,http://localhost:5173}
      TRUST_PROXY: ${TRUST_PROXY:-true}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      TRUST_PROXY_CIDRS: ${TRUST_PROXY_CIDRS:-}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env to a strong random value}
      AGENT_TOKEN: ${AGENT_TOKEN:?Set AGENT_TOKEN in .env to a strong random value}
      PROTECTED_FOLDER_PIN: ${PROTECTED_FOLDER_PIN:?Set PROTECTED_FOLDER_PIN in .env}
      PROTECTED_FOLDER_PATTERNS: ${PROTECTED_FOLDER_PATTERNS:-}
      ADMIN_USER: ${ADMIN_USER:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
      THUMBNAILS_DIR: /data/video-catalog/thumbnails
      PUBLIC_THUMBNAILS_BASE_URL: /thumbnails
      AGENT_ERROR_RETENTION_DAYS: ${AGENT_ERROR_RETENTION_DAYS:-180}
      ACTION_AUDIT_RETENTION_DAYS: ${ACTION_AUDIT_RETENTION_DAYS:-365}
      SCAN_RETENTION_DAYS: ${SCAN_RETENTION_DAYS:-180}
    volumes:
      - thumbnails_data:/data/video-catalog/thumbnails
    ports:
      - "${SERVER_BIND_ADDR:-127.0.0.1}:${SERVER_PUBLISHED_PORT:-4001}:4000"

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "${WEB_BIND_ADDR:-0.0.0.0}:${WEB_PUBLISHED_PORT:-8081}:8080"
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
      - /var/run
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  thumbnails_data:
